# XcodeGen spec: the GitHub Actions Mac turns this into GlassMusic.xcodeproj (no Mac needed here)
name: GlassMusic
options:
  bundleIdPrefix: com.glassmusic
  deploymentTarget:
    iOS: "15.0"
targets:
  GlassMusic:
    type: application
    platform: iOS
    sources:
      - GlassMusic
      - path: ../index.html # the one web app, shared with the Windows build
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassmusic.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    info:
      path: GlassMusic/Info.plist
      properties:
        CFBundleDisplayName: Glass Music
        CFBundleShortVersionString: $(MARKETING_VERSION) # the CI sets these per build so SideStore sees updates
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
